name: Auto-merge Cursor PRs

# Optional for docs-only wikis: merge bot / Cursor agent PRs into the default branch
# without waiting on human review. Delete this workflow if your repo needs review gates.

on:
  schedule:
    - cron: '0 10 * * 1-5'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      stale_hours:
        description: Hours of inactivity before a bot draft is merged
        required: false
        default: '24'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Merge ready bot PRs and stale bot drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STALE_HOURS: ${{ github.event.inputs.stale_hours || '24' }}
        run: |
          set -euo pipefail

          cutoff=$(date -u -d "-${STALE_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          echo "Merging ready bot PRs and bot drafts with no activity since $cutoff against $DEFAULT_BRANCH"

          mapfile -t prs < <(
            gh pr list \
              --state open \
              --base "$DEFAULT_BRANCH" \
              --limit 100 \
              --json number,updatedAt,author,isDraft \
              --jq ".[]
                    | select(.author.is_bot == true or .author.login == \"cursoragent\")
                    | select(.isDraft == false or .updatedAt < \"$cutoff\")
                    | [.number, .isDraft] | @tsv"
          )

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No eligible bot PRs to merge."
            exit 0
          fi

          failed=0
          for entry in "${prs[@]}"; do
            IFS=$'\t' read -r pr is_draft <<< "$entry"
            echo "::group::PR #$pr"
            if { [ "$is_draft" = false ] || gh pr ready "$pr"; } && gh pr merge "$pr" --squash --delete-branch; then
              echo "Merged #$pr"
            else
              echo "::warning::Could not merge #$pr (conflict, failing check, or protected branch)"
              failed=1
            fi
            echo "::endgroup::"
          done

          exit $failed
